<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Plan Maker</title>
  <meta name="theme-color" content="#4f46e5">
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f9fafb; }
    h1 { color: #4f46e5; text-align: center; }
    input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { background: #4f46e5; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    #result { white-space: pre-wrap; background: white; padding: 16px; border-radius: 8px; margin-top: 16px; border: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <h1>📚 Lesson Plan Maker</h1>
  
  <input id="grade" placeholder="Grade (e.g. Grade 5)">
  <input id="subject" placeholder="Subject (e.g. Math)">
  <textarea id="topic" placeholder="Topic (e.g. Fractions)" rows="3"></textarea>
  <button id="generateBtn" onclick="generatePlan()">Generate Lesson Plan</button>
  
  <div id="result"></div>

  <script>
    async function generatePlan() {
      const grade = document.getElementById('grade').value;
      const subject = document.getElementById('subject').value;
      const topic = document.getElementById('topic').value;
      const btn = document.getElementById('generateBtn');
      const result = document.getElementById('result');
      
      if (!grade || !subject || !topic) {
        result.innerText = 'Please fill in all fields';
        return;
      }
      
      btn.disabled = true;
      btn.innerText = 'Generating...';
      result.innerText = 'App is ready! Next we add the Claude API key to make it work.';
      btn.disabled = false;
      btn.innerText = 'Generate Lesson Plan';
    }
  </script>
</body>
</html>
